<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640">
<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #243044; }
  .suptitle { font-size: 27px; font-weight: 700; }
  .subtitle { font-size: 15px; fill: #6b7280; }
  .title { font-size: 18px; font-weight: 700; }
  .label { font-size: 14px; font-weight: 600; }
  .legend { font-size: 13px; fill: #6b7280; }
  .value { font-size: 13px; font-family: Consolas, Menlo, monospace; fill: #243044; }
</style>
<rect width="980" height="640" fill="#f8fafc"/>
<text x="28" y="40" class="suptitle">Engagement Performance: Baseline vs Facilitated</text>

<g transform="translate(28,90)">
  <rect width="925" height="220" rx="8" fill="#ffffff" stroke="#d8dee9" stroke-width="1.5"/>
  <text x="18" y="28" class="title">Engagement Volume</text>
  
<g transform="translate(305,29)">
  <rect x="0" y="-10" width="13" height="13" rx="2" fill="#4f8edb"/>
  <text x="19" y="1" class="legend">Baseline</text>
  <rect x="88" y="-10" width="13" height="13" rx="2" fill="#37a66b"/>
  <text x="107" y="1" class="legend">Facilitated</text>
</g>

  <text x="18.0" y="70.0" class="label">Community engagement</text>
  <rect x="186.0" y="58.0" width="125.0" height="12" rx="2" fill="#4f8edb"/>
  <rect x="186.0" y="78.0" width="133.0" height="12" rx="2" fill="#37a66b"/>
  <text x="344.0" y="68.0" class="value">125.0</text>
  <text x="344.0" y="88.0" class="value">133.0</text>

  <text x="18.0" y="112.0" class="label">Engagement per post</text>
  <rect x="186.0" y="100.0" width="112.4" height="12" rx="2" fill="#4f8edb"/>
  <rect x="186.0" y="120.0" width="118.8" height="12" rx="2" fill="#37a66b"/>
  <text x="344.0" y="110.0" class="value">0.45</text>
  <text x="344.0" y="130.0" class="value">0.475</text>

  <text x="18.0" y="154.0" class="label">User total engagement</text>
  <rect x="186.0" y="142.0" width="125.0" height="12" rx="2" fill="#4f8edb"/>
  <rect x="186.0" y="162.0" width="133.0" height="12" rx="2" fill="#37a66b"/>
  <text x="344.0" y="152.0" class="value">125.0</text>
  <text x="344.0" y="172.0" class="value">133.0</text>

  <text x="18.0" y="196.0" class="label">Official post engagement</text>
  <rect x="186.0" y="184.0" width="120.0" height="12" rx="2" fill="#4f8edb"/>
  <rect x="186.0" y="204.0" width="82.5" height="12" rx="2" fill="#37a66b"/>
  <text x="344.0" y="194.0" class="value">16.0</text>
  <text x="344.0" y="214.0" class="value">11.0</text>

</g>


<g transform="translate(28,330)">
  <rect width="925" height="170" rx="8" fill="#ffffff" stroke="#d8dee9" stroke-width="1.5"/>
  <text x="18" y="28" class="title">Response Health</text>
  
<g transform="translate(305,29)">
  <rect x="0" y="-10" width="13" height="13" rx="2" fill="#4f8edb"/>
  <text x="19" y="1" class="legend">Baseline</text>
  <rect x="88" y="-10" width="13" height="13" rx="2" fill="#37a66b"/>
  <text x="107" y="1" class="legend">Facilitated</text>
</g>

  <text x="18.0" y="82.0" class="label">Reply rate</text>
  <rect x="186.0" y="70.0" width="92.8" height="12" rx="2" fill="#4f8edb"/>
  <rect x="186.0" y="90.0" width="92.2" height="12" rx="2" fill="#37a66b"/>
  <text x="344.0" y="80.0" class="value">15%</text>
  <text x="344.0" y="100.0" class="value">15%</text>

  <text x="18.0" y="138.0" class="label">Unanswered posts</text>
  <rect x="186.0" y="126.0" width="122.5" height="12" rx="2" fill="#4f8edb"/>
  <rect x="186.0" y="146.0" width="114.1" height="12" rx="2" fill="#37a66b"/>
  <text x="344.0" y="136.0" class="value">82%</text>
  <text x="344.0" y="156.0" class="value">76%</text>

</g>

</svg>
