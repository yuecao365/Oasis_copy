# Oasis Twitter simulation config
# Run from repo root: python simulation/twitter_simulation.py --config_path simulation/config.yaml
#
# Point csv_path to your agent/persona data. Paths are relative to repo root.
# To use personas from the generation pipeline:
#   csv_path: persona_generation/outputs/user_personas.csv

---
data:
  db_path: data/simu_db/facilitated_run.db
  csv_path: persona_generation/outputs/user_personas_yue.csv
  # Official accounts whose real test-period posts are injected verbatim each timestep.
  # Community agents always see these posts in their feed and can like/comment/repost them.
  official_accounts:
    - vechainofficial
  # CSV containing the official posts (same file used for ground-truth comparison).
  official_posts_csv_path: persona_generation/outputs/test_tweets.csv

simulation:
  # If auto_num_timesteps_from_split=true, num_timesteps is ignored and derived
  # from persona_generation/outputs/split_info.json test_period duration.
  num_timesteps: 48
  auto_num_timesteps_from_split: false
  split_info_path: persona_generation/outputs/split_info.json
  # Source train split used to estimate user activity probabilities.
  train_activity_csv_path: persona_generation/outputs/train_tweets.csv
  # Use "weekly" (7-dim) or "hourly" (24-dim) activity profile.
  activity_granularity: weekly
  # Fallback activity probability if a user has sparse data.
  default_activity_probability: 0.10
  # Per-step post budget. If null and auto_target_posts_per_step_from_train=true,
  # estimate from train data average post rate and timestep_hours.
  target_posts_per_step: 11
  auto_target_posts_per_step_from_train: false
  # Multi-action controls in manual_probabilistic mode:
  # each active agent performs at least 1 action, up to max_actions_per_active_agent.
  max_actions_per_active_agent: 1
  # Probability of adding one more action slot (geometric, evaluated repeatedly).
  extra_action_probability: 0.5
  # One simulation step represents this many real-world hours.
  timestep_hours: 12.0
  # Value written to clock.time_step each iteration: timestep * clock_step_units.
  clock_step_units: 1
  # Increase autonomous agent action firing rate.
  agent_activation_multiplier: 4.0
  min_activation_threshold: 0.10
  clock_factor: 60
  recsys_type: random
  # "manual_probabilistic" samples actions from distribution below.
  action_selection_mode: manual_probabilistic
  # Probabilities are normalized automatically.
  action_probabilities:
    like_post: 0.60
    create_post: 0.10
    create_comment: 0.20
    repost: 0.10
  available_actions:
    - create_post
    - create_comment
    - repost
    - like_post

synthetic_agents:
  - role: community_manager
    username: community_manager
    name: VeChain Community Manager
    bio: "VeChain community manager | Connecting builders, creators, and believers in the ecosystem"
    user_char: "Warm, encouraging, and always ready to engage. I make sure no voice goes unheard — I like and amplify great community content, surface buried posts, and occasionally add a warm response to spark discussion."
    category_description: "VeChain ecosystem, community building, blockchain adoption, member engagement"
    action_probabilities:
      like_post: 0.50
      create_comment: 0.30
      repost: 0.15
      create_post: 0.05
    feed_mode: unanswered   # prioritizes posts with 0 comments
    always_active: true
    actions_per_timestep: 3

  - role: domain_expert
    username: vechain_analyst
    name: VeChain Analyst
    bio: "Blockchain researcher & VeChain ecosystem analyst | Supply chain | DeFi | Real-world assets | Opinions my own"
    user_char: "Analytical curator of VeChain content. I surface and amplify the best community posts with likes and reposts, occasionally add expert commentary, and rarely post original content so I don't crowd the feed."
    category_description: "VeChain technology, blockchain infrastructure, DeFi, supply chain traceability, enterprise blockchain, tokenomics, ecosystem developments"
    action_probabilities:
      like_post: 0.45
      repost: 0.25
      create_comment: 0.15
      create_post: 0.15
    feed_mode: default
    always_active: true
    actions_per_timestep: 2

  - role: discussion_facilitator
    username: vechain_connector
    name: VeChain Connector
    bio: "Connecting VeChain community members | Sparking real conversations across the ecosystem"
    user_char: "I exist to turn monologues into dialogues. I ask pointed open-ended questions in comments, quote community posts with discussion prompts, and actively follow members whose voices deserve more reach — all to get community members talking to each other."
    category_description: "VeChain community discussion, blockchain ecosystem, peer-to-peer engagement, conversation facilitation"
    action_probabilities:
      create_comment: 0.45
      quote_post: 0.25
      like_post: 0.20
      follow: 0.10
    feed_mode: default
    always_active: true
    actions_per_timestep: 3

inference:
  model_name: qwen3.5-plus
  base_url: https://coding.dashscope.aliyuncs.com/v1
  # API key is read from this environment variable at runtime.
  api_key_env: DASHSCOPE_API_KEY
  # Max feed posts shown to each agent in the LLM prompt.
  max_feed_posts: 8
  # Max concurrent LLM calls per timestep.
  llm_concurrency: 3
  # Per-call timeout in seconds.
  llm_timeout: 60.0
  # Retries on transient API errors.
  llm_max_retries: 2
